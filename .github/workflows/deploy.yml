name: 🚀 Deploy
on:
  push:
    branches:
      - main
      - dev
  pull_request: {}
  schedule:
    # Weekly canary on the default branch. Runner-image drift has already broken
    # the Prisma jobs (the engine is tied to the runner's OpenSSL), and main can
    # go weeks between merges, so without this the first sign is a red PR.
    - cron: '0 6 * * 1'
permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: 🎨 Prettier
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🎨 Check formatting
        run: npm run format

  lint:
    name: ⬣ ESLint
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🔬 Lint
        run: npm run lint

  typecheck:
    name: ʦ TypeScript
    # Prisma 3.15.2 has no engine for the newer ubuntu-latest OpenSSL, so its
    # client never generates and every typed query fails. Pin until Prisma is
    # upgraded.
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🔎 Type check
        run: npm run typecheck --if-present

  patterns:
    name: 🚫 Patterns we do not use
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🚫 Check routes and components
        run: npm run check:patterns

  storybook:
    name: 📚 Storybook
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 📚 Build Storybook
        run: npm run build-storybook

      - name: 🎭 Install Chromium
        run: npx playwright install --with-deps chromium

      - name: ♿ Check stories for a11y and the patterns we do not use
        run: npm run check-storybook

  vitest:
    name: ⚡ Vitest
    # Pinned with the other Prisma jobs: the database push and Prisma client
    # need an OpenSSL version Prisma 3.15.2 ships an engine for.
    runs-on: ubuntu-22.04
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🏄 Copy test env vars
        run: cp .env.example .env.test

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🐳 Docker compose
        # the sleep is just there to give time for postgres to get started
        run: docker compose up -d && sleep 3
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/flexspotff_test'

      - name: ⚡ Run vitest
        run: npm run test

  migrations:
    name: 🗃️ Migration drift
    # Pinned with the other Prisma jobs: `migrate deploy` needs an engine for
    # this runner's OpenSSL, which Prisma 3.15.2 predates.
    runs-on: ubuntu-22.04
    env:
      DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/flexspotff_test'
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install deps
        run: npm ci

      - name: 🐳 Docker compose
        # the sleep is just there to give time for postgres to get started
        run: docker compose up -d && sleep 3

      - name: 🚚 Apply committed migrations
        run: npx prisma migrate deploy

      - name: 🔍 Check schema matches migrations
        # exits non-zero (2) if schema.prisma has changes not captured in a
        # migration, i.e. a model was added without a matching migration file
        run: >
          npx prisma migrate diff --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma --exit-code

  docker-check:
    name: 🐳 Docker build check
    # The real build only runs on a push to main or dev, so check the image
    # everywhere else: a PR checks the install stage, which is where package.json
    # changes break (#263's prepare script did, for five days), and the weekly
    # canary builds the whole image without pushing it.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build without pushing
        uses: docker/build-push-action@v6
        with:
          push: false
          target: ${{ github.event_name == 'pull_request' && 'deps' || '' }}
          cache-from: type=gha

  build:
    name: 🐳 Build
    # only build/deploy main branch on pushes
    if:
      ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔓 Login to Vultr Container Registry
        uses: docker/login-action@v3
        with:
          registry: sjc.vultrcr.com/chrisparsons
          username: ${{ secrets.VULTR_USERNAME }}
          password: ${{ secrets.VULTR_API_KEY }}

      - name: 🗄️ Save to Vultr Container Registry
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: sjc.vultrcr.com/chrisparsons/flexspotff:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PROD_DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs:
      [lint, typecheck, format, patterns, storybook, vitest, migrations, build]
    # only deploy main/dev branch on pushes
    if:
      ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      github.event_name == 'push' }}

    steps:
      - name: Deploy app to Vultr VPS
        uses: appleboy/ssh-action@master
        env:
          VULTR_USERNAME: ${{ secrets.VULTR_USERNAME }}
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: VULTR_USERNAME, VULTR_API_KEY
          script: |
            docker login sjc.vultrcr.com/chrisparsons -u $VULTR_USERNAME -p $VULTR_API_KEY && cd flexspotff && docker compose pull && docker compose up -d

  alert:
    name: 🚨 Alert on failure
    # A red main, dev or canary run is otherwise only seen by whoever looks.
    needs:
      [
        lint,
        typecheck,
        format,
        patterns,
        storybook,
        vitest,
        migrations,
        docker-check,
        build,
        deploy,
      ]
    if: ${{ failure() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚨 Post to the admin alerts channel
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ALERTS_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
            github.run_id }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_ALERTS_WEBHOOK_URL is not set, so no alert was posted."
            exit 0
          fi
          content="The $EVENT run on $REF failed: $RUN_URL"
          jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail --silent --show-error --max-time 10 \
              -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
